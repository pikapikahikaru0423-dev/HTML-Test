<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stage Layout Maker v22.0 (Full Specs)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #1d9e75; --accent: #e11d48; --bg: #d8d6cf; --sidebar-w: 180px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; background: var(--bg); overflow: hidden; touch-action: none; }

        /* UI Structure */
        #toolbar { height: 50px; background: white; border-bottom: 1px solid #ccc; display: flex; align-items: center; padding: 0 12px; gap: 8px; z-index: 100; flex-shrink: 0; overflow-x: auto; }
        #main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        #sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ccc; display: flex; flex-direction: column; flex-shrink: 0; z-index: 50; }
        #canvas-area { flex: 1; overflow: auto; position: relative; background: #bbb; padding: 80px; scroll-behavior: smooth; }
        
        /* Canvas Layers */
        #zoom-layer { transform-origin: top left; }
        #stage { position: relative; background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        #pdf-canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        #svg-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; overflow: visible; }
        #elements-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
        
        /* Elements */
        .elem { position: absolute; display: flex; align-items: center; justify-content: center; cursor: move; pointer-events: auto; font-weight: bold; font-size: 11px; text-align: center; }
        .elem.selected { outline: 3px solid var(--primary); outline-offset: 4px; z-index: 100 !important; }
        .chair { border-radius: 50%; border: 2px solid; background: white; }
        .rect { border: 2px solid; background: rgba(200,200,200,0.1); }
        .label { border: 1px solid transparent; background: transparent; }

        /* Utility */
        #selection-box { position: absolute; border: 1px solid var(--primary); background: rgba(29,158,117,0.1); pointer-events: none; display: none; z-index: 200; }
        #prop-bar { height: 50px; background: white; border-top: 1px solid #ccc; display: flex; align-items: center; padding: 0 20px; gap: 15px; font-size: 12px; z-index: 300; }
        
        button { padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white; font-size: 12px; white-space: nowrap; }
        button.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }
        .tab { flex: 1; padding: 10px 2px; text-align: center; font-size: 11px; cursor: pointer; border-bottom: 1px solid #ccc; background: #f0f0f0; color: #666; }
        .tab.active { background: white; border-bottom: 2px solid var(--primary); color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div id="toolbar">
    <button id="tool-select" class="active" onclick="setTool('select')">選択</button>
    <button id="tool-chair" onclick="setTool('chair')">椅子</button>
    <button id="tool-arc" onclick="setTool('arc')">弧配置</button>
    <button id="tool-label" onclick="setTool('label')">ラベル</button>
    <button id="tool-rect" onclick="setTool('rect')">四角</button>
    <div style="width:1px; height:20px; background:#ccc; margin:0 5px;"></div>
    <button onclick="undo()">Undo</button>
    <button onclick="deleteSelected()" style="color:var(--accent)">削除</button>
    <button onclick="createRisers()">層 ひな壇</button>
    <button onclick="document.getElementById('pdf-input').click()">📂 PDF</button>
    <button onclick="exportJSON()">💾 保存</button>
    <button onclick="exportPNG()" style="background:var(--primary); color:white;">📷 出力</button>
    <input type="file" id="pdf-input" accept="application/pdf" style="display:none" onchange="loadPDF(this.files[0])">
</div>

<div id="main-content">
    <div id="sidebar"></div>
    <div id="canvas-area">
        <div id="zoom-layer">
            <div id="stage" style="width: 1000px; height: 750px;">
                <canvas id="pdf-canvas"></canvas>
                <svg id="svg-layer"></svg>
                <div id="elements-layer"></div>
                <div id="selection-box"></div>
            </div>
        </div>
    </div>
</div>

<div id="prop-bar">要素を選択して編集</div>

<script>
// --- 1. State Management ---
let state = {
    elements: [],
    selectedIds: [],
    currentTool: 'select',
    zoom: 1.0,
    history: [],
    historyIndex: -1,
    tempPoints: []
};

const INSTRUMENTS = {
    woodwind: [
        {l:"Fl", c:"#e35"}, {l:"Ob", c:"#e35"}, {l:"Cl", c:"#36a"}, {l:"B.Cl", c:"#36a"},
        {l:"Fg", c:"#e35"}, {l:"A.Sax", c:"#1a8"}, {l:"T.Sax", c:"#1a8"}, {l:"B.Sax", c:"#1a8"}
    ],
    brass: [
        {l:"Tp", c:"#c70"}, {l:"Hr", c:"#84a"}, {l:"Tb", c:"#a84"}, 
        {l:"Euph", c:"#08a"}, {l:"Tu", c:"#08a"}, {l:"St.B", c:"#08a"}
    ],
    perc: [
        {l:"Timps", c:"#555"}, {l:"S.D.", c:"#555"}, {l:"B.D.", c:"#555"}, 
        {l:"Cym", c:"#555"}, {l:"Glock", c:"#555"}, {l:"Xylo", c:"#555"}, {l:"Vibe", c:"#555"}
    ]
};

let currentInst = INSTRUMENTS.woodwind[0];
let dragSession = null;
let boxStart = null;

// --- 2. Core Render ---
function render() {
    const layer = document.getElementById('elements-layer');
    layer.innerHTML = '';
    state.elements.forEach(el => {
        const div = document.createElement('div');
        div.className = `elem ${el.type} ${state.selectedIds.includes(el.id) ? 'selected' : ''}`;
        div.style.cssText = `left:${el.x}px; top:${el.y}px; width:${el.w}px; height:${el.h}px; border-color:${el.color}; color:${el.color};`;
        div.innerHTML = `<span>${el.label || ''}</span>`;
        div.onpointerdown = (e) => handleElementDown(e, el);
        layer.appendChild(div);
    });
    renderSVG();
    updatePropertyUI();
}

function renderSVG() {
    const svg = document.getElementById('svg-layer');
    svg.innerHTML = '';
    const groups = {};
    state.elements.forEach(el => { if (el.gid && el.pts) groups[el.gid] = el.pts; });

    Object.keys(groups).forEach(gid => {
        const p = groups[gid];
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${p[0].x} ${p[0].y} Q ${p[2].x} ${p[2].y} ${p[1].x} ${p[1].y}`);
        path.setAttribute('stroke', 'rgba(29, 158, 117, 0.3)');
        path.setAttribute('fill', 'none'); path.setAttribute('stroke-dasharray', '5,5'); path.setAttribute('stroke-width', '20');
        path.style.cursor = 'move'; path.style.pointerEvents = 'auto';
        path.onpointerdown = (e) => {
            if (state.currentTool !== 'select') return;
            e.stopPropagation();
            const rect = document.getElementById('stage').getBoundingClientRect();
            dragSession = { type: 'group', gid: parseFloat(gid), ox: (e.clientX - rect.left)/state.zoom, oy: (e.clientY - rect.top)/state.zoom, originalPts: JSON.parse(JSON.stringify(p)) };
        };
        svg.appendChild(path);
    });

    if (state.currentTool === 'arc' && state.tempPoints.length > 0) {
        const guide = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const p = state.tempPoints;
        const rect = document.getElementById('stage').getBoundingClientRect();
        const mx = (window.lastX - rect.left) / state.zoom || p[0].x;
        const my = (window.lastY - rect.top) / state.zoom || p[0].y;
        let d = `M ${p[0].x} ${p[0].y}`;
        if (p.length === 1) d += ` L ${mx} ${my}`;
        else if (p.length === 2) d += ` Q ${mx} ${my} ${p[1].x} ${p[1].y}`;
        guide.setAttribute('d', d); guide.setAttribute('stroke', 'var(--primary)'); guide.setAttribute('fill', 'none'); guide.setAttribute('stroke-width', '2');
        svg.appendChild(guide);
    }
}

// --- 3. Interaction Handlers ---
function setupEvents() {
    const stage = document.getElementById('stage');
    stage.onpointerdown = (e) => {
        const rect = stage.getBoundingClientRect();
        const x = (e.clientX - rect.left) / state.zoom;
        const y = (e.clientY - rect.top) / state.zoom;

        if (state.currentTool === 'chair') {
            addElement('chair', x - 13, y - 13);
        } else if (state.currentTool === 'arc') {
            state.tempPoints.push({x, y});
            if (state.tempPoints.length === 3) {
                const n = parseInt(prompt("椅子の数", "5"));
                if (n) {
                    const gid = Date.now();
                    for (let i = 0; i < n; i++) {
                        const t = n > 1 ? i / (n - 1) : 0.5;
                        const pos = getPointOnArc(state.tempPoints, t);
                        state.elements.push({ id: Math.random(), type: 'chair', x: pos.x-13, y: pos.y-13, w:26, h:26, color: currentInst.c, label: currentInst.l, gid, pts: JSON.parse(JSON.stringify(state.tempPoints)), t });
                    }
                    saveHistory();
                }
                state.tempPoints = [];
            }
            render();
        } else if (state.currentTool === 'select' && (e.target.id === 'stage' || e.target.id === 'elements-layer')) {
            state.selectedIds = [];
            boxStart = { x, y };
            document.getElementById('selection-box').style.display = 'block';
            render();
        } else if (state.currentTool === 'label') {
            const txt = prompt("テキストを入力", "Label");
            if(txt) addElement('label', x, y, { label: txt, w: 80, h: 30 });
        } else if (state.currentTool === 'rect') {
            addElement('rect', x, y, { w: 100, h: 60, label: '', color: '#999' });
        }
    };

    window.onpointermove = (e) => {
        window.lastX = e.clientX; window.lastY = e.clientY;
        const rect = stage.getBoundingClientRect();
        const x = (e.clientX - rect.left) / state.zoom;
        const y = (e.clientY - rect.top) / state.zoom;

        if (dragSession) {
            if (dragSession.type === 'elem') {
                dragSession.group.forEach(g => { g.el.x = x - g.ox; g.el.y = y - g.oy; if(g.el.gid) delete g.el.gid; });
            } else if (dragSession.type === 'group') {
                const dx = x - dragSession.ox, dy = y - dragSession.oy;
                const newPts = dragSession.originalPts.map(p => ({ x: p.x + dx, y: p.y + dy }));
                state.elements.forEach(el => { if (el.gid === dragSession.gid) { el.pts = newPts; const pos = getPointOnArc(newPts, el.t); el.x = pos.x - el.w/2; el.y = pos.y - el.h/2; } });
            }
            render();
        } else if (boxStart) {
            const x1 = Math.min(boxStart.x, x), y1 = Math.min(boxStart.y, y);
            const x2 = Math.max(boxStart.x, x), y2 = Math.max(boxStart.y, y);
            const sb = document.getElementById('selection-box');
            sb.style.left = x1+'px'; sb.style.top = y1+'px'; sb.style.width = (x2-x1)+'px'; sb.style.height = (y2-y1)+'px';
            state.selectedIds = state.elements.filter(el => el.x > x1 && el.x < x2 && el.y > y1 && el.y < y2).map(el => el.id);
            render();
        } else if (state.currentTool === 'arc') { renderSVG(); }
    };

    window.onpointerup = () => { if (dragSession || boxStart) saveHistory(); dragSession = null; boxStart = null; document.getElementById('selection-box').style.display = 'none'; };
}

function handleElementDown(e, el) {
    e.stopPropagation();
    if (state.currentTool !== 'select') return;
    if (!e.shiftKey && !state.selectedIds.includes(el.id)) state.selectedIds = [el.id];
    else if (e.shiftKey) state.selectedIds.push(el.id);
    const rect = document.getElementById('stage').getBoundingClientRect();
    const x = (e.clientX - rect.left) / state.zoom;
    const y = (e.clientY - rect.top) / state.zoom;
    dragSession = { type: 'elem', group: state.elements.filter(item => state.selectedIds.includes(item.id)).map(item => ({ el: item, ox: x - item.x, oy: y - item.y })) };
    render();
}

// --- 4. Sidebar & Properties ---
function initSidebar() {
    const sb = document.getElementById('sidebar');
    sb.innerHTML = `<div style="display:flex;"><div class="tab active" onclick="switchTab('woodwind')" id="t-woodwind">木管</div><div class="tab" onclick="switchTab('brass')" id="t-brass">金管</div><div class="tab" onclick="switchTab('perc')" id="t-perc">打楽</div></div><div id="inst-cont" style="flex:1; overflow-y:auto; background:white;"></div>`;
    switchTab('woodwind');
}

function switchTab(cat) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`t-${cat}`).classList.add('active');
    const cont = document.getElementById('inst-cont');
    cont.innerHTML = '';
    INSTRUMENTS[cat].forEach(inst => {
        const div = document.createElement('div');
        div.style.cssText = "padding:12px; cursor:pointer; border-bottom:1px solid #f0f0f0; font-size:13px; display:flex; align-items:center; gap:8px;";
        div.innerHTML = `<span style="width:12px; height:12px; background:${inst.c}; border-radius:50%;"></span>${inst.l}`;
        div.onclick = () => { currentInst = inst; setTool('chair'); };
        cont.appendChild(div);
    });
}

function updatePropertyUI() {
    const propBar = document.getElementById('prop-bar');
    if (state.selectedIds.length === 0) { propBar.innerHTML = "要素を選択して編集"; return; }
    const el = state.elements.find(e => e.id === state.selectedIds[0]);
    propBar.innerHTML = `
        ラベル: <input type="text" id="p-label" value="${el.label}" style="width:70px">
        色: <input type="color" id="p-color" value="${el.color}">
        W: <input type="number" id="p-w" value="${el.w}" style="width:45px">
        H: <input type="number" id="p-h" value="${el.h}" style="width:45px">
    `;
    document.getElementById('p-label').oninput = (e) => updateSelected('label', e.target.value);
    document.getElementById('p-color').onchange = (e) => updateSelected('color', e.target.value);
    document.getElementById('p-w').oninput = (e) => updateSelected('w', parseInt(e.target.value));
    document.getElementById('p-h').oninput = (e) => updateSelected('h', parseInt(e.target.value));
}

function updateSelected(key, val) { state.elements.forEach(el => { if (state.selectedIds.includes(el.id)) { el[key] = val; if(el.gid) delete el.gid; } }); render(); }

// --- 5. Features (PDF, Risers, Export) ---
async function loadPDF(file) {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async function() {
        const pdf = await pdfjsLib.getDocument({data: new Uint8Array(this.result)}).promise;
        const page = await pdf.getPage(1);
        const canvas = document.getElementById('pdf-canvas');
        const viewport = page.getViewport({scale: 2.0});
        canvas.width = viewport.width; canvas.height = viewport.height;
        document.getElementById('stage').style.width = viewport.width + 'px';
        document.getElementById('stage').style.height = viewport.height + 'px';
        await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    };
    reader.readAsArrayBuffer(file);
}

function createRisers() {
    const baseW = 800, baseH = 120;
    const colors = ['#eee', '#ddd', '#ccc'];
    for(let i=0; i<3; i++) {
        addElement('rect', 100, 50 + (i*baseH), { w: baseW, h: baseH, color: colors[i], label: (3-i)+'段' });
    }
}

// --- 6. Utilities ---
function getPointOnArc(p, t) { return { x: Math.pow(1-t, 2)*p[0].x + 2*(1-t)*t*p[2].x + Math.pow(t, 2)*p[1].x, y: Math.pow(1-t, 2)*p[0].y + 2*(1-t)*t*p[2].y + Math.pow(t, 2)*p[1].y }; }
function setTool(t) { state.currentTool = t; state.tempPoints = []; document.querySelectorAll('#toolbar button').forEach(b => b.classList.toggle('active', b.id === `tool-${t}`)); render(); }
function addElement(type, x, y, opts = {}) { state.elements.push({ id: Math.random(), type, x, y, w: opts.w || 26, h: opts.h || 26, color: opts.color || currentInst.c, label: opts.label || currentInst.l, ...opts }); saveHistory(); render(); }
function saveHistory() { state.history = state.history.slice(0, state.historyIndex + 1); state.history.push(JSON.stringify(state.elements)); state.historyIndex++; }
function undo() { if (state.historyIndex > 0) { state.historyIndex--; state.elements = JSON.parse(state.history[state.historyIndex]); render(); } }
function deleteSelected() { state.elements = state.elements.filter(el => !state.selectedIds.includes(el.id)); state.selectedIds = []; render(); saveHistory(); }
function exportJSON() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state.elements)])); a.download = 'layout.json'; a.click(); }
function exportPNG() { html2canvas(document.getElementById('stage')).then(c => { const a = document.createElement('a'); a.href = c.toDataURL(); a.download = 'layout.png'; a.click(); }); }

window.onload = () => { setupEvents(); initSidebar(); render(); };
</script>
</body>
</html>
