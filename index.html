<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舞台配置図 Pro v18.1.2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{display:flex;flex-direction:column;height:100vh;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:#d8d6cf;overflow:hidden;touch-action:none;}

/* Toolbar */
#toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 10px;background:white;border-bottom:1px solid #ddd;min-height:42px;flex-shrink:0;z-index:100;}
.tb-group{display:flex;align-items:center;gap:4px;font-size:11px;}
.tb-sep{width:1px;height:22px;background:#e0e0e0;margin:0 2px;}
button{padding:6px 10px;font-size:11px;border:1px solid #ccc;border-radius:5px;background:white;cursor:pointer;color:#333;white-space:nowrap;transition:background .12s;}
button:hover{background:#f0f0ee;}
button.active{background:#e1f5ee;border-color:#1d9e75;color:#0f6e56;font-weight:600;}
input[type=range]{width:60px;cursor:pointer;vertical-align:middle;}
input[type=number]{width:42px;padding:2px 4px;font-size:11px;border:1px solid #ccc;border-radius:4px;text-align:center;}

/* Main Layout */
#main{display:flex;flex:1;overflow:hidden;}
#sidebar{width:175px;background:white;border-right:1px solid #ddd;display:flex;flex-direction:column;flex-shrink:0;}
.tabs{display:flex;border-bottom:1px solid #eee;background:#f9f9f9;}
.tab{flex:1;padding:10px 2px;text-align:center;cursor:pointer;font-size:10px;color:#888;border-bottom:2px solid transparent;}
.tab.active{border-bottom:2px solid #1d9e75;color:#1d9e75;font-weight:600;background:white;}
.inst-list{flex:1;overflow-y:auto;padding-bottom:20px;}
.inst-header{padding:8px 10px;font-size:10px;color:#999;background:#fdfdfd;font-weight:bold;border-bottom:1px solid #eee;margin-top:5px;}
.inst{padding:8px 10px;font-size:11px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;align-items:center;gap:6px;}

#canvas-wrap{flex:1;overflow:auto;position:relative;background:#d8d6cf;}
#zoom-container{transform-origin:top left;position:absolute;top:20px;left:20px;}
#stage{position:relative;background:white;border:1px solid #aaa;box-shadow:0 2px 16px rgba(0,0,0,0.18);touch-action:none;}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;display:none;}
.stage-grid{position:absolute;inset:0;pointer-events:none;z-index:2;background-image:linear-gradient(rgba(0,0,0,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.05) 1px,transparent 1px);background-size:30px 30px;}
#svg-layer{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:3;}

/* Elements */
.elem{position:absolute;cursor:move;user-select:none;touch-action:none;z-index:10;pointer-events:auto;}
.chair-container{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.chair-circle{position:absolute;inset:0;border-radius:50%;border:2px solid;background:white;z-index:1;}
.chair-text{position:relative;z-index:5;white-space:nowrap;text-align:center;line-height:1;font-weight:700;width:80%;height:80%;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;}
.elem.selected{outline:2px solid #1d9e75;outline-offset:4px;}

.label-elem{background:white;border:1px solid #aaa;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;padding:2px;text-align:center;}
.rect-elem{border:2px solid #555;background:rgba(200,200,200,0.15);}
.dim-elem{pointer-events:auto;}
.dim-line{position:absolute;height:2px;background:#1d9e75;transform-origin:0 50%;}
.dim-text{position:absolute;color:#1d9e75;font-weight:bold;font-size:11px;white-space:nowrap;transform:translate(-50%,-120%);}

/* Rails & SVG */
.rail-path{fill:none;stroke:rgba(29, 158, 117, 0.4);stroke-width:2;stroke-dasharray:4,4;pointer-events:auto;cursor:move;}
#preview-path{fill:none;stroke:#1d9e75;stroke-width:2;pointer-events:none;}

/* UI Props */
#props-bar{padding:5px 12px;background:white;border-top:1px solid #eee;font-size:11px;display:flex;align-items:center;justify-content:space-between;min-height:40px;flex-shrink:0;}
#props{display:flex;align-items:center;gap:10px;}
#hint-box{color:#666;background:#f5f5f5;padding:4px 10px;border-radius:4px;border-left:3px solid #1d9e75;}
#selection-rect{position:absolute;border:1px solid #1d9e75;background:rgba(29,158,117,0.15);pointer-events:none;z-index:1000;display:none;}
</style>
</head>
<body>

<div id="toolbar">
  <div class="tb-group">
    <button id="btn-select" class="active" onclick="setTool('select')">▷ 選択</button>
    <button id="btn-chair" onclick="setTool('chair')">○ 椅子</button>
    <button id="btn-arc" onclick="setTool('arc')">⌒ 弧配置</button>
    <button id="btn-line" onclick="setTool('line')">─ 線配置</button>
    <button id="btn-label" onclick="setTool('label')">Ａ ラベル</button>
    <button id="btn-rect" onclick="setTool('rect')">□ 四角</button>
    <button id="btn-dim" onclick="setTool('dim')">↔ 寸法</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    ズーム:<input type="range" id="zoom-range" min="30" max="150" step="5" value="100" oninput="changeZoom(this.value)">
    <input type="number" id="zoom-input" value="100" onchange="changeZoom(this.value)">%
    サイズ:<input type="range" id="size-range" min="15" max="60" step="1" value="26" oninput="updateSizeSetting(this.value)">
    <input type="number" id="size-input" value="26" onchange="updateSizeSetting(this.value)">px
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button onclick="undo()">↩ 戻す</button>
    <button onclick="redo()">↪ 進む</button>
    <button onclick="groupSelection()">グループ化</button>
    <button onclick="ungroupSelection()">解除</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button onclick="exportTemplate()">💾 テンプレ保存</button>
    <button onclick="importTemplate()">📂 テンプレ読込</button>
    <button onclick="loadPDF()">📄 PDF読込</button>
    <button onclick="exportPNG()" style="background:#1d9e75;color:white;">📷 画像書き出し</button>
    <button onclick="clearAll()" style="color:red;">⚠ 消去</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="tabs">
      <div class="tab active" id="tab-main-btn" onclick="switchTab('main')">木・金</div>
      <div class="tab" id="tab-other-btn" onclick="switchTab('other')">その他</div>
      <div class="tab" id="tab-perc-btn" onclick="switchTab('perc')">Perc.</div>
    </div>
    <div id="list-main" class="inst-list"></div>
    <div id="list-other" class="inst-list" style="display:none"></div>
    <div id="list-perc" class="inst-list" style="display:none"></div>
  </div>
  <div id="canvas-wrap">
    <div id="zoom-container">
      <div id="stage" style="width:960px;height:700px;">
        <canvas id="bg"></canvas>
        <div class="stage-grid"></div>
        <svg id="svg-layer"></svg>
        <div id="selection-rect"></div>
      </div>
    </div>
  </div>
</div>

<div id="props-bar">
  <div id="props">要素を選択して編集</div>
  <div id="hint-box">💡 ヒント: 左のリストから楽器を選んで配置。</div>
</div>

<script>
// --- Master Data ---
const MAIN_INST=[{l:"Pic",c:"#e35"},{l:"Fl",c:"#e35"},{l:"Ob",c:"#c44"},{l:"B♭Cl",c:"#36a"},{l:"B.Cl",c:"#36a"},{l:"A.Sax",c:"#1a8"},{l:"T.Sax",c:"#1a8"},{l:"B.Sax",c:"#1a8"},{l:"Fg",c:"#c44"},{l:"Tp",c:"#c70"},{l:"Tb",c:"#a84"},{l:"Hr",c:"#84a"},{l:"Tu",c:"#08a"},{l:"Eu",c:"#08a"},{l:"Stb",c:"#555"}];
const OTHER_INST=[{l:"Cor Angl.",c:"#c44"},{l:"E♭Cl",c:"#36a"},{l:"A.Cl",c:"#36a"},{l:"CA.Cl",c:"#36a"},{l:"S.Sax",c:"#1a8"}];
const PERC_COLOR = "#2a4a8a";
const PERC_LABELS=["BD","Chime","Harp","Piano","Vib.","Xlo.","Marb.","Glo.","W.C.","T.-tam","Timb.","Bongos","Congas","StPa","Base","Synth."];
const PERC_CHAIRS=["Timp.","S.D.","4Tom","S.Cym","C.Cym","Drm","Bongos","Congas"];

let elements=[], groups=[], selectedList=[], tool='select';
let zoomLevel=1.0, currentChairSize=26, idCounter=0;
let currentInst=MAIN_INST[0];
let draggingObjs=[], isSelecting=false, selectStart={x:0,y:0};
let arcPts=[], linePts=[], dimPts=[], history=[], historyIndex=-1;

const stage=document.getElementById('stage'), svg=document.getElementById('svg-layer'), selRectDom=document.getElementById('selection-rect');

function init(){
  renderList(MAIN_INST,'list-main'); renderList(OTHER_INST,'list-other'); renderPercList();
  setupEvents(); saveHistory();
}

function renderList(list,id){
  const container=document.getElementById(id);
  list.forEach(inst=>{
    const div=document.createElement('div'); div.className='inst';
    div.innerHTML=`<span style="width:10px;height:10px;background:${inst.c};border-radius:50%"></span>${inst.l}`;
    div.onclick=()=>{ currentInst=inst; updateInstSelection(div); if(tool==='select') setTool('chair'); };
    container.appendChild(div);
  });
}
function renderPercList(){
  const container=document.getElementById('list-perc');
  const addSec=(title,list,isChair)=>{
    const h=document.createElement('div'); h.className='inst-header'; h.textContent=title; container.appendChild(h);
    list.forEach(l=>{
      const div=document.createElement('div'); div.className='inst';
      div.innerHTML=`<span style="width:10px;height:10px;background:${PERC_COLOR};border-radius:${isChair?'50%':'2px'}"></span>${l}`;
      div.onclick=()=>{ updateInstSelection(div); if(isChair){ currentInst={l:l,c:PERC_COLOR}; setTool('chair'); } else { addElem('label',400,300,{text:l,color:PERC_COLOR,w:45,h:25}); setTool('select'); }};
      container.appendChild(div);
    });
  };
  addSec("ラベル形式", PERC_LABELS, false); addSec("円形(椅子)形式", PERC_CHAIRS, true);
}
function updateInstSelection(el){ document.querySelectorAll('.inst').forEach(e=>e.style.background=''); el.style.background='#e1f5ee'; }
function switchTab(t){ ['main','other','perc'].forEach(k=>{ document.getElementById(`list-${k}`).style.display=t===k?'block':'none'; document.getElementById(`tab-${k}-btn`).className='tab '+(t===k?'active':''); }); }

// --- Drawing Helpers ---
function getAutoFontSize(text, diameter) {
    const len = text.length;
    let scale = (len <= 2) ? 0.45 : (len <= 4) ? 0.38 : 1.2 / len;
    return Math.min(diameter * scale, diameter * 0.85);
}

function addElem(type,x,y,opts={}){
  const id=opts.id||++idCounter;
  const div=document.createElement('div');
  div.className='elem'; div.dataset.id=id;
  div.style.left=x+'px'; div.style.top=y+'px';
  const w=opts.w||(type==='chair'?currentChairSize:type==='rect'?80:50), h=opts.h||(type==='chair'?currentChairSize:type==='rect'?40:25);
  const color=opts.color || (type==='chair'?currentInst.c:'#555');
  div.style.width=w+'px'; div.style.height=h+'px';
  
  if(type==='chair'){
    const lbl = opts.label||currentInst.l;
    const fs = getAutoFontSize(lbl, w);
    div.innerHTML=`<div class="chair-container"><div class="chair-circle" style="border-color:${color};"></div><div class="chair-text" style="color:${color}; font-size:${fs}px;">${lbl}</div></div>`;
  } else if(type==='dim'){
    div.className+=' dim-elem'; div.style.width='auto'; div.style.height='auto';
    div.innerHTML=`<div class="dim-line" style="width:${w}px;transform:rotate(${opts.angle}deg)"></div><div class="dim-text" style="left:${w/2}px">${opts.text}</div>`;
  } else {
    div.className+=(type==='label'?' label-elem':' rect-elem'); div.style.borderColor=color; div.style.color=color; div.textContent=opts.text||'';
  }
  stage.appendChild(div);
  const rec={id,type,dom:div,x,y,w,h,angle:opts.angle||0,color,label:opts.label||'',text:opts.text||'',t:opts.t||0,parentId:opts.parentId||null};
  elements.push(rec); return rec;
}

// --- Grouping Logic ---
function groupSelection(){
  if(selectedList.length < 2) return;
  const gId = ++idCounter;
  const g = {id: gId, type: 'custom', children: selectedList.map(e=>e.id)};
  selectedList.forEach(e => e.parentId = gId);
  groups.push(g);
  clearSelection(); saveHistory();
}
function ungroupSelection(){
  if(!selectedList.length) return;
  const targetGroupId = selectedList[0].parentId;
  if(!targetGroupId) return;
  groups = groups.filter(g => g.id !== targetGroupId);
  elements.forEach(e => { if(e.parentId === targetGroupId) e.parentId = null; });
  renderRails(); clearSelection(); saveHistory();
}

// --- Rails & Previews ---
function createRail(type, pts, n, inst){
  const railId = ++idCounter;
  const railGroup = {id:railId, type, pts, children:[]};
  for(let i=0; i<n; i++){
    const t = i/(n-1||1);
    const pos = getPosOnRail(type, pts, t);
    const child = addElem('chair', pos.x-currentChairSize/2, pos.y-currentChairSize/2, {label:inst.l, color:inst.c, t:t, parentId:railId});
    railGroup.children.push(child.id);
  }
  groups.push(railGroup);
  renderRails(); saveHistory();
}
function getPosOnRail(type, pts, t){
  if(type==='line'){
    return {x: pts[0].x+(pts[1].x-pts[0].x)*t, y: pts[0].y+(pts[1].y-pts[0].y)*t};
  } else {
    const [p1,p2,p3]=pts;
    const x=Math.pow(1-t,2)*p1.x+2*(1-t)*t*p3.x+Math.pow(t,2)*p2.x;
    const y=Math.pow(1-t,2)*p1.y+2*(1-t)*t*p3.y+Math.pow(t,2)*p2.y;
    return {x,y};
  }
}
function renderRails(){
  svg.innerHTML='';
  groups.forEach(g=>{
    if(g.type==='custom') return;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    let d='';
    if(g.type==='line') d=`M${g.pts[0].x},${g.pts[0].y} L${g.pts[1].x},${g.pts[1].y}`;
    else d=`M${g.pts[0].x},${g.pts[0].y} Q${g.pts[2].x},${g.pts[2].y} ${g.pts[1].x},${g.pts[1].y}`;
    path.setAttribute('d',d);
    path.setAttribute('class','rail-path');
    path.dataset.groupId = g.id;
    svg.appendChild(path);
  });
}
function updatePreview(pt){
  const existing = document.getElementById('preview-path');
  if(existing) existing.remove();
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('id','preview-path');
  let d = '';
  if(tool==='arc'){
    if(arcPts.length===1) d=`M${arcPts[0].x},${arcPts[0].y} L${pt.x},${pt.y}`;
    else if(arcPts.length===2) d=`M${arcPts[0].x},${arcPts[0].y} Q${pt.x},${pt.y} ${arcPts[1].x},${arcPts[1].y}`;
  } else if(tool==='line' && linePts.length===1){
    d=`M${linePts[0].x},${linePts[0].y} L${pt.x},${pt.y}`;
  } else if(tool==='dim' && dimPts.length===1){
    d=`M${dimPts[0].x},${dimPts[0].y} L${pt.x},${pt.y}`;
  }
  if(d){ path.setAttribute('d',d); svg.appendChild(path); }
}

// --- Events ---
function setupEvents(){
  stage.addEventListener('pointerdown',onDown); window.addEventListener('pointermove',onMove); window.addEventListener('pointerup',onUp);
  window.addEventListener('keydown', e => { if(e.key==='Delete'||e.key==='Backspace') deleteSelected(); });
}
function getXY(e){ const r=stage.getBoundingClientRect(); return {x:(e.clientX-r.left)/zoomLevel, y:(e.clientY-r.top)/zoomLevel}; }

function onDown(e){
  const pt=getXY(e);
  const ed=e.target.closest('.elem');
  const rail=e.target.closest('.rail-path');

  if(tool==='select'){
    if(rail){
      const g = groups.find(x=>x.id==rail.dataset.groupId);
      const members = elements.filter(el=>el.parentId == g.id);
      clearSelection();
      members.forEach(m=>{ m.dom.classList.add('selected'); selectedList.push(m); });
      draggingObjs = selectedList.map(o=>({obj:o, ox:pt.x-o.x, oy:pt.y-o.y, railGroup:g}));
      return;
    }
    if(ed){
      const rec=elements.find(el=>el.id==ed.dataset.id);
      if(!selectedList.includes(rec)) selectSingle(rec);
      // グループ全体を移動対象にする
      const moveTargets = [];
      selectedList.forEach(s=>{
          if(s.parentId){
              const g = groups.find(x=>x.id==s.parentId);
              if(g.type==='custom'){ // カスタムグループは全体移動
                  elements.filter(el=>el.parentId===g.id).forEach(m=>{if(!moveTargets.includes(m)) moveTargets.push(m);});
              } else { // レールはスライド
                  moveTargets.push(s);
              }
          } else {
              moveTargets.push(s);
          }
      });
      draggingObjs=moveTargets.map(o=>({obj:o, ox:pt.x-o.x, oy:pt.y-o.y, railGroup: (o.parentId && groups.find(x=>x.id==o.parentId).type!=='custom')?groups.find(x=>x.id==o.parentId):null}));
      return;
    }
    clearSelection(); isSelecting=true; selectStart=pt; selRectDom.style.display='block';
  } else if(tool==='chair') addElem('chair',pt.x-currentChairSize/2,pt.y-currentChairSize/2);
  else if(tool==='arc'){ arcPts.push(pt); if(arcPts.length===3){ const n=prompt("椅子の数",6); if(n) createRail('arc', [...arcPts], n, currentInst); arcPts=[]; renderRails(); } }
  else if(tool==='line'){ linePts.push(pt); if(linePts.length===2){ const n=prompt("椅子の数",4); if(n) createRail('line', [...linePts], n, currentInst); linePts=[]; renderRails(); } }
  else if(tool==='label') addElem('label',pt.x-25,pt.y-12,{text:prompt('ラベル内容','')||'Label'});
  else if(tool==='rect') addElem('rect',pt.x-40,pt.y-20);
  else if(tool==='dim'){ dimPts.push(pt); if(dimPts.length===2){ const val=prompt("寸法値","1.0m"); if(val){ const dx=dimPts[1].x-dimPts[0].x, dy=dimPts[1].y-dimPts[0].y; addElem('dim',dimPts[0].x,dimPts[0].y,{w:Math.sqrt(dx*dx+dy*dy),angle:Math.atan2(dy,dx)*180/Math.PI,text:val}); } dimPts=[]; renderRails(); } }
}

function onMove(e){
  const pt=getXY(e);
  if(isSelecting){
    const x=Math.min(pt.x,selectStart.x), y=Math.min(pt.y,selectStart.y), w=Math.abs(pt.x-selectStart.x), h=Math.abs(pt.y-selectStart.y);
    selRectDom.style.left=x+'px'; selRectDom.style.top=y+'px'; selRectDom.style.width=w+'px'; selRectDom.style.height=h+'px';
    elements.forEach(el=>{ if(el.x>x&&el.x+el.w<x+w&&el.y>y&&el.y+el.h<y+h) { if(!selectedList.includes(el)){el.dom.classList.add('selected'); selectedList.push(el);}} });
    updateProps();
  }
  if(draggingObjs.length){
    // レール全体移動判定 (一つでもrailGroupかつレール本体を掴んでいる場合)
    const isRailMove = draggingObjs.some(d=>d.railGroup && !e.target.closest('.elem'));
    draggingObjs.forEach(d=>{
      if(d.railGroup && !isRailMove){ // 椅子単体のスライド
        let bestT=0, minDist=999999;
        for(let i=0; i<=100; i++){
          const p = getPosOnRail(d.railGroup.type, d.railGroup.pts, i/100);
          const dist = Math.hypot(p.x-pt.x, p.y-pt.y);
          if(dist < minDist){ minDist=dist; bestT=i/100; }
        }
        d.obj.t = bestT; const pos = getPosOnRail(d.railGroup.type, d.railGroup.pts, bestT);
        d.obj.x = pos.x-d.obj.w/2; d.obj.y = pos.y-d.obj.h/2;
      } else { // 自由移動 or レール全体移動
        const oldX = d.obj.x, oldY = d.obj.y;
        d.obj.x=pt.x-d.ox; d.obj.y=pt.y-d.oy;
        if(d.railGroup && isRailMove){ // レールの点も同期
            const dx = d.obj.x - oldX, dy = d.obj.y - oldY;
            if(d.obj.id === d.railGroup.children[0]){ // 代表して最初の要素が点を動かす
                 d.railGroup.pts.forEach(p=>{p.x+=dx; p.y+=dy;}); renderRails();
            }
        }
      }
      d.obj.dom.style.left=d.obj.x+'px'; d.obj.dom.style.top=d.obj.y+'px';
    });
  }
  if(tool!=='select') updatePreview(pt);
}
function onUp(){ 
  isSelecting=false; selRectDom.style.display='none'; 
  if(draggingObjs.length) saveHistory(); 
  draggingObjs=[]; 
  const p=document.getElementById('preview-path'); if(p) p.remove(); 
}

// --- UI Logic ---
function selectSingle(r){ clearSelection(); if(r){ selectedList=[r]; r.dom.classList.add('selected'); } updateProps(); }
function clearSelection(){ selectedList.forEach(r=>{r.dom.classList.remove('selected');}); selectedList=[]; updateProps(); }
function setTool(t){ tool=t; arcPts=[]; linePts=[]; dimPts=[]; renderRails(); document.querySelectorAll('button[id^=btn-]').forEach(b=>b.classList.remove('active')); document.getElementById('btn-'+t)?.classList.add('active'); }
function changeZoom(v){ zoomLevel=v/100; document.getElementById('zoom-range').value=v; document.getElementById('zoom-input').value=v; document.getElementById('zoom-container').style.transform=`scale(${zoomLevel})`; }
function updateSizeSetting(v){ currentChairSize=parseInt(v); document.getElementById('size-range').value=v; document.getElementById('size-input').value=v; }
function updateProps(){
  const p=document.getElementById('props');
  if(!selectedList.length){ p.textContent='要素を選択して編集'; return; }
  const s=selectedList[0];
  p.innerHTML=`選択中：<button onclick="deleteSelected()" style="color:red">削除</button>
  内容:<input type="text" value="${s.type==='chair'?s.label:s.text}" oninput="updatePropVal(this.value)">
  <input type="color" value="${s.color}" onchange="updatePropColor(this.value)">`;
}
function updatePropVal(v){ selectedList.forEach(s=>{ if(s.type==='chair'){ s.label=v; const t=s.dom.querySelector('.chair-text'); t.textContent=v; t.style.fontSize=getAutoFontSize(v,s.w)+'px'; } else { s.text=v; if(s.type==='dim') s.dom.querySelector('.dim-text').textContent=v; else s.dom.textContent=v; } }); }
function updatePropColor(c){ selectedList.forEach(s=>{ s.color=c; if(s.type==='chair'){ s.dom.querySelector('.chair-circle').style.borderColor=c; s.dom.querySelector('.chair-text').style.color=c; } else { s.dom.style.borderColor=c; s.dom.style.color=c; } }); }
function deleteSelected(){ selectedList.forEach(s=>{ s.dom.remove(); elements=elements.filter(e=>e.id!==s.id); if(s.parentId){ groups.forEach(g=>g.children=g.children.filter(cid=>cid!==s.id)); } }); clearSelection(); saveHistory(); renderRails(); }
function clearAll(){ if(confirm("全消去しますか？")){ elements.forEach(e=>e.dom.remove()); elements=[]; groups=[]; renderRails(); saveHistory(); } }

// --- History & Template ---
function saveHistory(){ const s=JSON.stringify({elements:elements.map(e=>({...e,dom:null})), groups}); history=history.slice(0,historyIndex+1); history.push(s); historyIndex++; }
function undo(){ if(historyIndex>0){ historyIndex--; applyState(); } }
function redo(){ if(historyIndex<history.length-1){ historyIndex++; applyState(); } }
function applyState(){
  const data=JSON.parse(history[historyIndex]);
  elements.forEach(e=>e.dom.remove()); elements=[]; groups=data.groups;
  data.elements.forEach(en=>addElem(en.type,en.x,en.y,en)); renderRails();
}
function exportPNG(){ html2canvas(stage,{scale:2}).then(c=>{ const a=document.createElement('a'); a.download='stage_layout.png'; a.href=c.toDataURL(); a.click(); }); }
function exportTemplate(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify({elements:elements.map(e=>({...e,dom:null})),groups})],{type:'application/json'})); a.download='layout.json'; a.click(); }
function importTemplate(){ const i=document.createElement('input'); i.type='file'; i.onchange=async e=>{ const d=JSON.parse(await e.target.files[0].text()); elements.forEach(el=>el.dom.remove()); elements=[]; groups=d.groups; d.elements.forEach(en=>addElem(en.type,en.x,en.y,en)); renderRails(); saveHistory(); }; i.click(); }
async function loadPDF(){ const i=document.createElement('input'); i.type='file'; i.accept='.pdf'; i.onchange=async e=>{ const d=new Uint8Array(await e.target.files[0].arrayBuffer()); pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; const pdf=await pdfjsLib.getDocument({data:d}).promise; const page=await pdf.getPage(1); const vp=page.getViewport({scale:1.5}); const cv=document.getElementById('bg'); cv.width=vp.width; cv.height=vp.height; stage.style.width=vp.width+'px'; stage.style.height=vp.height+'px'; await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; cv.style.display='block'; }; i.click(); }

window.onload=init;
</script>
