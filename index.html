<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stage Layout Maker v21.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* CSS変数の定義（Reactのテーマ管理に移行しやすい） */
        :root { --primary: #1d9e75; --accent: #e11d48; --bg: #d8d6cf; --sidebar-w: 180px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; background: var(--bg); overflow: hidden; touch-action: none; }

        /* UI Layout */
        #app-container { display: flex; flex-direction: column; height: 100%; }
        #toolbar { height: 50px; background: white; border-bottom: 1px solid #ccc; display: flex; align-items: center; padding: 0 12px; gap: 10px; z-index: 100; overflow-x: auto; }
        #main-content { display: flex; flex: 1; overflow: hidden; }
        
        #sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        #canvas-area { flex: 1; overflow: auto; position: relative; background: #bbb; padding: 100px; }
        
        /* Canvas Objects */
        #zoom-layer { transform-origin: top left; }
        #stage { position: relative; background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        #pdf-canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        #svg-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; overflow: visible; }
        
        /* Elements Style */
        .elem { position: absolute; z-index: 20; display: flex; align-items: center; justify-content: center; cursor: move; pointer-events: auto; }
        .elem.selected { outline: 3px solid var(--primary); outline-offset: 4px; }
        .chair { border-radius: 50%; border: 2px solid; background: white; }
        
        /* Utility */
        .hidden { display: none !important; }
        button { padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white; white-space: nowrap; }
        button.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="toolbar" id="toolbar-ui">
        <button id="tool-select" class="active" onclick="setTool('select')">選択</button>
        <button id="tool-chair" onclick="setTool('chair')">椅子</button>
        <button id="tool-arc" onclick="setTool('arc')">弧配置</button>
        <div style="flex:1"></div>
        <button onclick="undo()">Undo</button>
        <button onclick="exportJSON()">保存</button>
    </div>

    <div id="main-content">
        <div id="sidebar">
            <div id="instrument-list"></div>
        </div>
        <div id="canvas-area">
            <div id="zoom-layer">
                <div id="stage" style="width: 1000px; height: 750px;">
                    <canvas id="pdf-canvas"></canvas>
                    <svg id="svg-layer"></svg>
                    <div id="elements-layer"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * Stage Layout Maker - Core Engine (v21.0)
 * 将来のReact化を想定し、Stateオブジェクトを中心に設計
 */

// --- 1. State (状態管理) ---
let state = {
    elements: [],       // 全オブジェクト
    selectedIds: [],    // 選択中のID
    currentTool: 'select',
    zoom: 1.0,
    history: [],
    historyIndex: -1,
    canvasSize: { w: 1000, h: 750 },
    tempPoints: []      // 弧配置などのクリック一時保存
};

// --- 2. Constants (定数) ---
const CHAIR_SIZE = 26;

// --- 3. Core Functions (核となる関数) ---

function render() {
    const layer = document.getElementById('elements-layer');
    layer.innerHTML = ''; // 再描画

    state.elements.forEach(el => {
        const div = document.createElement('div');
        div.className = `elem ${el.type} ${state.selectedIds.includes(el.id) ? 'selected' : ''}`;
        div.style.left = `${el.x}px`;
        div.style.top = `${el.y}px`;
        div.style.width = `${el.w}px`;
        div.style.height = `${el.h}px`;
        div.style.borderColor = el.color;
        div.style.color = el.color;
        div.innerHTML = `<span>${el.label || ''}</span>`;
        
        // イベント紐付け（Reactではここが各コンポーネント内になる）
        div.onpointerdown = (e) => handleElementDown(e, el);
        
        layer.appendChild(div);
    });

    renderSVG(); // ガイド線描画
}

// ツール切り替え
function setTool(toolName) {
    state.currentTool = toolName;
    state.tempPoints = [];
    document.querySelectorAll('#toolbar button').forEach(btn => {
        btn.classList.toggle('active', btn.id === `tool-${toolName}`);
    });
    render();
}

// --- 4. Event Handlers (イベント) ---
function setupEvents() {
    const stage = document.getElementById('stage');
    
    stage.onpointerdown = (e) => {
        if (e.target !== stage && e.target.id !== 'elements-layer') return;
        
        const rect = stage.getBoundingClientRect();
        const x = (e.clientX - rect.left) / state.zoom;
        const y = (e.clientY - rect.top) / state.zoom;

        if (state.currentTool === 'chair') {
            addElement('chair', x - CHAIR_SIZE/2, y - CHAIR_SIZE/2);
        } else if (state.currentTool === 'select') {
            state.selectedIds = [];
            render();
        }
        // 弧配置ロジック等はここに追加していく
    };
}

/* --- ADD_LOGIC_HERE --- */
// ここに、これから出す「追加機能」を貼り付けていきます

// 初期化
window.onload = () => {
    setupEvents();
    render();
};

// ユーティリティ
function addElement(type, x, y, opts = {}) {
    const newEl = {
        id: Date.now() + Math.random(),
        type, x, y, 
        w: opts.w || CHAIR_SIZE, 
        h: opts.h || CHAIR_SIZE,
        color: opts.color || '#333',
        label: opts.label || '',
        ...opts
    };
    state.elements.push(newEl);
    saveHistory();
    render();
}

function saveHistory() {
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push(JSON.stringify(state.elements));
    state.historyIndex++;
}

function undo() {
    if (state.historyIndex > 0) {
        state.historyIndex--;
        state.elements = JSON.parse(state.history[state.historyIndex]);
        render();
    }
}

// 仮のSVG描画（後で詳細ロジックをAdd-onで追加）
function renderSVG() {
    const svg = document.getElementById('svg-layer');
    svg.innerHTML = '';
}
</script>
</body>
</html>
