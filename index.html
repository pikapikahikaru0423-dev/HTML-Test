<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舞台配置図 Pro v17.9.4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{display:flex;flex-direction:column;height:100vh;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:#d8d6cf;overflow:hidden;touch-action:none;}

/* Toolbar */
#toolbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:5px 10px;background:white;border-bottom:1px solid #ddd;
  min-height:42px;flex-shrink:0;z-index:100;
}
.tb-group{display:flex;align-items:center;gap:4px;font-size:11px;}
.tb-sep{width:1px;height:22px;background:#e0e0e0;margin:0 2px;}

button{
  padding:6px 10px;font-size:11px;border:1px solid #ccc;border-radius:5px;
  background:white;cursor:pointer;color:#333;white-space:nowrap;
  transition:background .12s;
}
button:hover{background:#f0f0ee;}
button.active{background:#e1f5ee;border-color:#1d9e75;color:#0f6e56;font-weight:600;}

input[type=range]{width:60px;cursor:pointer;vertical-align:middle;}
input[type=number]{width:45px;padding:2px 4px;font-size:11px;border:1px solid #ccc;border-radius:4px;text-align:center;}

/* Main Layout */
#main{display:flex;flex:1;overflow:hidden;}
#sidebar{width:175px;background:white;border-right:1px solid #ddd;display:flex;flex-direction:column;flex-shrink:0;}
.tabs{display:flex;border-bottom:1px solid #eee;background:#f9f9f9;}
.tab{flex:1;padding:10px 2px;text-align:center;cursor:pointer;font-size:10px;color:#888;border-bottom:2px solid transparent;}
.tab.active{border-bottom:2px solid #1d9e75;color:#1d9e75;font-weight:600;background:white;}
.inst-list{flex:1;overflow-y:auto;padding-bottom:20px;}
.inst-header{padding:8px 10px;font-size:10px;color:#999;background:#fdfdfd;font-weight:bold;border-bottom:1px solid #eee;margin-top:5px;}
.inst{padding:8px 10px;font-size:11px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;align-items:center;gap:6px;}

#canvas-wrap{flex:1;overflow:auto;position:relative;background:#d8d6cf;}
#zoom-container{transform-origin:top left;position:absolute;top:20px;left:20px;}
#stage{position:relative;background:white;border:1px solid #aaa;box-shadow:0 2px 16px rgba(0,0,0,0.18);touch-action:none;}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;display:none;}
.stage-grid{position:absolute;inset:0;pointer-events:none;z-index:2;background-image:linear-gradient(rgba(0,0,0,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.05) 1px,transparent 1px);background-size:30px 30px;}
#svg-layer{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:3;}

/* Selection Box */
#selection-rect{position:absolute;border:1px solid #1d9e75;background:rgba(29,158,117,0.15);pointer-events:none;z-index:1000;display:none;}

/* Elements */
.elem{position:absolute;cursor:move;user-select:none;touch-action:none;z-index:10;pointer-events:auto;}
.chair{border-radius:50%;border:2px solid;background:white;display:flex;align-items:center;justify-content:center;font-weight:600;width:100%;height:100%;}
.chair-text{position:absolute;white-space:nowrap;pointer-events:none;text-align:center;line-height:1;display: flex; align-items: center; justify-content: center; width: 85%; height: 85%; overflow: hidden;}
.elem.selected{outline:2px solid #1d9e75;outline-offset:4px;}
.label-elem{background:white;border:1px solid #aaa;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;padding:2px;text-align:center;}
.rect-elem{border:2px solid #555;background:rgba(200,200,200,0.1);display:flex;align-items:center;justify-content:center;}
.dim-elem{pointer-events:auto;}
.dim-line{position:absolute;height:2px;background:#1d9e75;transform-origin:0 50%;}
.dim-text{position:absolute;color:#1d9e75;font-weight:bold;font-size:12px;white-space:nowrap;transform:translate(-50%,-120%);}

/* Resize/Rotate Handles */
.handle{position:absolute;width:12px;height:12px;background:#1d9e75;border:2px solid white;border-radius:50%;z-index:25;display:none;}
.elem.selected .handle{display:block;}
.nw{top:-6px;left:-6px;cursor:nwse-resize;}
.se{bottom:-6px;right:-6px;cursor:nwse-resize;}
.rot{top:-25px;left:calc(50% - 6px);cursor:crosshair;background:#ff9800;}

#props-bar{padding:5px 12px;background:white;border-top:1px solid #eee;font-size:11px;display:flex;align-items:center;justify-content:space-between;min-height:40px;flex-shrink:0;}
#props{display:flex;align-items:center;gap:10px;}
#hint-box{color:#666;background:#f5f5f5;padding:4px 10px;border-radius:4px;border-left:3px solid #1d9e75;}
</style>
</head>
<body>

<div id="toolbar">
  <div class="tb-group">
    <button id="btn-select" class="active" onclick="setTool('select')">▷ 選択</button>
    <button id="btn-chair" onclick="setTool('chair')">○ 椅子</button>
    <button id="btn-arc" onclick="setTool('arc')">⌒ 弧配置</button>
    <button id="btn-line" onclick="setTool('line')">｜ 線配置</button>
    <button id="btn-label" onclick="setTool('label')">Ａ ラベル</button>
    <button id="btn-rect" onclick="setTool('rect')">□ 四角</button>
    <button id="btn-dim" onclick="setTool('dim')">↔ 寸法</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    ズーム:<input type="range" id="zoom-range" min="30" max="150" step="5" value="100" oninput="changeZoom(this.value)">
    <input type="number" id="zoom-input" value="100" min="30" max="150" onchange="changeZoom(this.value)">%
    
    椅子サイズ:<input type="range" id="size-range" min="15" max="60" step="1" value="26" oninput="updateSizeSetting(this.value)">
    <input type="number" id="size-input" value="26" min="15" max="60" onchange="updateSizeSetting(this.value)">px
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="undo-btn" onclick="undo()" title="Ctrl+Z">↩ 戻す</button>
    <button id="redo-btn" onclick="redo()" title="Ctrl+Y">↪ 進む</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button onclick="exportTemplate()">💾 テンプレ保存</button>
    <button onclick="importTemplate()">📂 テンプレ読込</button>
    <button onclick="loadPDF()">📄 PDF読込</button>
    <button onclick="exportPNG()" style="background:#1d9e75;color:white;">📷 画像書き出し</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="tabs">
      <div class="tab active" id="tab-main-btn" onclick="switchTab('main')">木・金</div>
      <div class="tab" id="tab-perc-btn" onclick="switchTab('perc')">打楽器</div>
      <div class="tab" id="tab-other-btn" onclick="switchTab('other')">他</div>
    </div>
    <div id="list-main" class="inst-list"></div>
    <div id="list-perc" class="inst-list" style="display:none"></div>
    <div id="list-other" class="inst-list" style="display:none"></div>
  </div>
  <div id="canvas-wrap">
    <div id="zoom-container">
      <div id="stage" style="width:960px;height:700px;">
        <canvas id="bg"></canvas>
        <div class="stage-grid"></div>
        <svg id="svg-layer"></svg>
        <div id="selection-rect"></div>
      </div>
    </div>
  </div>
</div>

<div id="props-bar">
  <div id="props">要素を選択して編集</div>
  <div id="hint-box">💡 ヒント: ツールを選択してください</div>
</div>

<script>
// --- Data & State ---
const MAIN_INST=[
  {l:"Pic",c:"#e35"},{l:"Fl",c:"#e35"},{l:"Ob",c:"#c44"},
  {l:"B♭Cl",c:"#36a"},{l:"B.Cl",c:"#36a"},
  {l:"A.Sax",c:"#1a8"},{l:"T.Sax",c:"#1a8"},{l:"B.Sax",c:"#1a8"},
  {l:"Fg",c:"#c44"},{l:"Tp",c:"#c70"},{l:"Tb",c:"#a84"},
  {l:"Hr",c:"#84a"},{l:"Tu",c:"#08a"},
  {l:"Eu",c:"#08a"},{l:"Stb",c:"#555"}
];
const PERC_COLOR = "#2a4a8a"; 
const PERC_LABELS=["BD","Chime","Harp","Piano","Vib.","Xlo.","Marb.","Glo.","W.C.","T.-tam","Timb.","Bongos","Congas","StPa","Base","Synth."];
const PERC_CHAIRS=["Timp.","S.D.","4Tom","S.Cym","C.Cym","Drm","Bongos","Congas"];
const PERC_MARCHING=["M.S.D.","M.BD1","M.BD2","M.BD3","M.BD4","TD"];
const OTHER_INST=[{l:"Cor Angl.",c:"#c44"},{l:"E♭Cl",c:"#36a"},{l:"A.Cl",c:"#36a"},{l:"S.Sax",c:"#1a8"}];

let elements=[], selectedList=[], tool='select';
let zoomLevel=1.0, currentChairSize=26, idCounter=0;
let currentInst=MAIN_INST[0], isShift=false;
let draggingObjs=[], resizingObj=null, resizeHandle='', rotatingObj=null, startAng=0, startMouseAng=0;
let arcPts=[], linePts=[], dimPts=[], history=[], historyIndex=-1;
let isSelecting=false, selectStart={x:0,y:0};

const stage=document.getElementById('stage');
const svg=document.getElementById('svg-layer');
const selRectDom=document.getElementById('selection-rect');

function init(){
  renderList(MAIN_INST,'list-main'); renderList(OTHER_INST,'list-other'); renderPercList();
  setupEvents(); saveHistory(); updateHint();
}

// --- UI Rendering ---
function renderList(list,id){
  const container=document.getElementById(id);
  list.forEach(inst=>{
    const div=document.createElement('div'); div.className='inst';
    div.innerHTML=`<span style="width:10px;height:10px;background:${inst.c};border-radius:50%"></span>${inst.l}`;
    div.onclick=()=>{ currentInst=inst; updateInstSelection(div); if(tool==='select') setTool('chair'); };
    container.appendChild(div);
  });
}
function renderPercList(){
  const container=document.getElementById('list-perc');
  const addSec=(title,list,type)=>{
    const h=document.createElement('div'); h.className='inst-header'; h.textContent=title; container.appendChild(h);
    list.forEach(l=>{
      const div=document.createElement('div'); div.className='inst';
      const isCircle = (type === 'chair' || type === 'marching');
      div.innerHTML=`<span style="width:10px;height:10px;background:${PERC_COLOR};border-radius:${isCircle?'50%':'2px'}"></span>${l}`;
      div.onclick=()=>{
        updateInstSelection(div);
        if(isCircle){ currentInst={l:l, c:PERC_COLOR}; setTool('chair'); }
        else { addElem('label',400,300,{text:l, color:PERC_COLOR, w:45, h:25}); setTool('select'); }
      };
      container.appendChild(div);
    });
  };
  addSec("ラベル（打楽器）", PERC_LABELS, "label");
  addSec("円形（打楽器）", PERC_CHAIRS, "chair");
  addSec("マーチング（円形）", PERC_MARCHING, "marching");
}
function updateInstSelection(el){ document.querySelectorAll('.inst').forEach(e=>e.style.background=''); el.style.background='#e1f5ee'; }
function switchTab(t){
  ['main','other','perc'].forEach(k=>{
    document.getElementById(`list-${k}`).style.display=t===k?'block':'none';
    document.getElementById(`tab-${k}-btn`).className='tab '+(t===k?'active':'');
  });
}

// --- Logic & Events ---
function setTool(t){
  tool=t; arcPts=[]; linePts=[]; dimPts=[]; clearSVG();
  document.querySelectorAll('button[id^=btn-]').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+t)?.classList.add('active');
  updateHint();
}
function updateHint(){
  const h=document.getElementById('hint-box');
  let text = {
    select:"ドラッグで範囲選択。要素を掴んで移動。Delキーで削除。",
    chair:`配置サイズ: ${currentChairSize}px。`,
    arc:"3クリックで弧配置。", line:"2クリックで直線配置。",
    dim:"2クリックで寸法表示。", label:"クリックでラベル配置。", rect:"クリックで四角配置。"
  }[tool] || "ツール選択";
  h.innerHTML = `💡 ヒント: ${text}`;
}

function changeZoom(v){ 
  const val = parseInt(v); zoomLevel = val / 100; 
  document.getElementById('zoom-range').value = val; document.getElementById('zoom-input').value = val;
  document.getElementById('zoom-container').style.transform=`scale(${zoomLevel})`; 
}
function updateSizeSetting(v){
  const val = parseInt(v); currentChairSize = val;
  document.getElementById('size-range').value = val; document.getElementById('size-input').value = val;
}

// フォントサイズの動的計算 (v17.9.4: 余白を考慮して0.9倍に調整)
function getAutoFontSize(text, radius) {
    const len = text.length;
    let baseSize;
    if (len <= 2) baseSize = radius * 0.40; // 以前の0.45より少し小さく
    else if (len <= 4) baseSize = radius * 0.32; // 以前の0.35より少し小さく
    else baseSize = radius * (1.1 / len); // 以前の1.2より小さく
    return baseSize;
}

function addElem(type,x,y,opts={}){
  const id=opts.id||++idCounter;
  const div=document.createElement('div');
  div.className='elem'; div.dataset.id=id;
  div.style.left=x+'px'; div.style.top=y+'px';
  const w=opts.w||(type==='chair'?currentChairSize:80), h=opts.h||(type==='chair'?currentChairSize:30);
  const ang=opts.angle||0, color=opts.color || (type==='chair'?currentInst.c:'#555');
  div.style.width=w+'px'; div.style.height=h+'px'; div.style.transform=`rotate(${ang}deg)`;
  
  if(type==='chair'){
    const labelText = opts.label||currentInst.l;
    const fs = getAutoFontSize(labelText, w);
    div.innerHTML=`<div class="chair" style="border-color:${color};color:${color}"><div class="chair-text" style="font-size:${fs}px">${labelText}</div></div>`;
  } else if(type==='dim'){
    div.className='elem dim-elem'; div.style.width='auto'; div.style.height='auto';
    div.innerHTML=`<div class="dim-line" style="width:${w}px;transform:rotate(${ang}deg)"></div><div class="dim-text" style="left:${w/2}px">${opts.text}</div>`;
  } else {
    div.className+=(type==='label'?' label-elem':' rect-elem');
    div.style.borderColor=color; div.style.color=color; div.textContent=opts.text||'';
    ['nw','se','rot'].forEach(p=>{ const h=document.createElement('div'); h.className='handle '+p; if(p!=='rot') h.dataset.pos=p; div.appendChild(h); });
  }
  stage.appendChild(div);
  const rec={id,type,dom:div,x,y,w,h,angle:ang,color,label:opts.label||'',text:opts.text||''};
  elements.push(rec); return rec;
}

function setupEvents(){
  stage.addEventListener('pointerdown',onDown);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('keydown', e => {
    if(e.key === 'Shift') isShift=true;
    if(e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
  });
  window.addEventListener('keyup', e => { if(e.key === 'Shift') isShift=false; });
}

function getXY(e){
  const r=stage.getBoundingClientRect();
  return {x:(e.clientX-r.left)/zoomLevel, y:(e.clientY-r.top)/zoomLevel};
}
function snap(p1, p2) {
  if (!isShift) return p2;
  const dx = Math.abs(p2.x - p1.x), dy = Math.abs(p2.y - p1.y);
  return dx > dy ? {x: p2.x, y: p1.y} : {x: p1.x, y: p2.y};
}

function onDown(e){
  let pt=getXY(e);
  if(e.target.classList.contains('handle')){
    const rec=elements.find(el=>el.dom===e.target.parentElement);
    if(e.target.classList.contains('rot')){
      rotatingObj=rec; const c={x:rec.x+rec.w/2, y:rec.y+rec.h/2};
      startMouseAng=Math.atan2(pt.y-c.y, pt.x-c.x); startAng=rec.angle||0;
    } else { resizingObj=rec; resizeHandle=e.target.dataset.pos; }
    e.stopPropagation(); return;
  }
  const ed=e.target.closest('.elem');
  if(ed){
    const rec=elements.find(el=>el.id==ed.dataset.id);
    if(tool==='select'){
      if(e.shiftKey) toggleSelect(rec); 
      else if(!selectedList.includes(rec)) selectSingle(rec);
      draggingObjs=selectedList.map(o=>({obj:o, ox:pt.x-o.x, oy:pt.y-o.y}));
    }
    return;
  }
  if(tool==='select'){ clearSelection(); isSelecting=true; selectStart=pt; selRectDom.style.display='block'; }
  else if(tool==='chair') addElem('chair',pt.x-currentChairSize/2,pt.y-currentChairSize/2);
  else if(tool==='label') addElem('label',pt.x-22,pt.y-12,{text:prompt('ラベル内容','')||'Label', color:PERC_COLOR, w:45, h:25});
  else if(tool==='rect') addElem('rect',pt.x-50,pt.y-30);
  else if(tool==='arc') handleArc(pt);
  else if(tool==='line') handleLine(pt);
  else if(tool==='dim') handleDim(pt);
}

function onMove(e){
  let pt=getXY(e);
  if(isSelecting){
    const x=Math.min(pt.x, selectStart.x), y=Math.min(pt.y, selectStart.y);
    const w=Math.abs(pt.x-selectStart.x), h=Math.abs(pt.y-selectStart.y);
    selRectDom.style.left=x+'px'; selRectDom.style.top=y+'px';
    selRectDom.style.width=w+'px'; selRectDom.style.height=h+'px';
    elements.forEach(el=>{
      const isInside = (el.x > x && el.x+el.w < x+w && el.y > y && el.y+el.h < y+h);
      if(isInside && !selectedList.includes(el)) { el.dom.classList.add('selected'); selectedList.push(el); }
      else if(!isInside && selectedList.includes(el) && !isShift) { el.dom.classList.remove('selected'); selectedList=selectedList.filter(s=>s!==el); }
    });
    updateProps();
  }
  if(draggingObjs.length){
    draggingObjs.forEach(d=>{ d.obj.x=pt.x-d.ox; d.obj.y=pt.y-d.oy; d.obj.dom.style.left=d.obj.x+'px'; d.obj.dom.style.top=d.obj.y+'px'; });
  }
  if(resizingObj){
    const r=resizingObj;
    if(resizeHandle==='se'){ r.w=Math.max(15,pt.x-r.x); r.h=Math.max(15,pt.y-r.y); }
    else if(resizeHandle==='nw'){ const or=r.x+r.w, ob=r.y+r.h; r.x=pt.x; r.y=pt.y; r.w=Math.max(15,or-pt.x); r.h=Math.max(15,ob-pt.y); }
    r.dom.style.left=r.x+'px'; r.dom.style.top=r.y+'px'; r.dom.style.width=r.w+'px'; r.dom.style.height=r.h+'px';
    if(r.type==='chair'){
        const txt=r.dom.querySelector('.chair-text');
        if(txt) txt.style.fontSize = getAutoFontSize(r.label, r.w) + 'px';
    }
  }
  if(rotatingObj){
    const r=rotatingObj, c={x:r.x+r.w/2, y:r.y+r.h/2};
    let a=startAng+(Math.atan2(pt.y-c.y, pt.x-c.x)-startMouseAng)*180/Math.PI;
    if(isShift) a = Math.round(a/45)*45;
    r.angle=a; r.dom.style.transform=`rotate(${r.angle}deg)`;
  }
  if(arcPts.length||linePts.length||dimPts.length) drawPreviews(pt);
}
function onUp(){
  if(isSelecting) { isSelecting=false; selRectDom.style.display='none'; }
  if(draggingObjs.length||resizingObj||rotatingObj) saveHistory();
  draggingObjs=[]; resizingObj=null; rotatingObj=null;
}

// --- Multi-Select & Props ---
function selectSingle(r){ clearSelection(); selectedList=[r]; r.dom.classList.add('selected'); updateProps(); }
function toggleSelect(r){ if(selectedList.includes(r)) { r.dom.classList.remove('selected'); selectedList=selectedList.filter(x=>x!==r); } else { r.dom.classList.add('selected'); selectedList.push(r); } updateProps(); }
function clearSelection(){ selectedList.forEach(r=>r.dom.classList.remove('selected')); selectedList=[]; updateProps(); }

function updateProps(){
  const p=document.getElementById('props');
  if(!selectedList.length){ p.textContent='要素を選択して編集'; return; }
  
  if(selectedList.length > 1) {
    p.innerHTML = `<span style="font-weight:bold;color:#1d9e75">${selectedList.length}個の要素を選択中</span> 
                   <button onclick="deleteSelected()" style="color:red;margin-left:10px;border-color:#f88">選択中の要素を削除</button>`;
    return;
  }
  
  const s=selectedList[0];
  let h=`内容:<input type="text" value="${s.type==='chair'?s.label:s.text}" oninput="updateSel('${s.type==='chair'?'label':'text'}',this.value)"> `;
  h+=`<button onclick="deleteSelected()" style="color:red">削除</button>`;
  p.innerHTML=h;
}
function updateSel(k,v){ selectedList.forEach(s=>{
  s[k]=v; if(k==='label') {
    const t=s.dom.querySelector('.chair-text');
    t.textContent=v; t.style.fontSize = getAutoFontSize(v, s.w) + 'px';
  }
  if(k==='text'){ if(s.type==='dim') s.dom.querySelector('.dim-text').textContent=v; else { const hs=s.dom.querySelectorAll('.handle'); s.dom.textContent=v; hs.forEach(h=>s.dom.appendChild(h)); } }
}); saveHistory(); }

function deleteSelected(){ selectedList.forEach(s=>{s.dom.remove();elements=elements.filter(e=>e.id!==s.id);}); clearSelection(); saveHistory(); }

// --- Others (Arc, Line, Dim, History, PDF/PNG) ---
function handleArc(pt){ arcPts.push(pt); if(arcPts.length===3){ const n=prompt("椅子の数",4); if(n){ const [p1,p2,p3]=arcPts; for(let i=0;i<n;i++){ const t=i/(n-1||1); const x=Math.pow(1-t,2)*p1.x+2*(1-t)*t*p3.x+Math.pow(t,2)*p2.x; const y=Math.pow(1-t,2)*p1.y+2*(1-t)*t*p3.y+Math.pow(t,2)*p2.y; addElem('chair',x-currentChairSize/2,y-currentChairSize/2); } saveHistory(); } arcPts=[]; clearSVG(); } }
function handleLine(pt){ const last=linePts[linePts.length-1], finalPt=last?snap(last,pt):pt; linePts.push(finalPt); if(linePts.length===2){ const n=prompt("椅子の数",4); if(n){ const [p1,p2]=linePts; for(let i=0;i<n;i++){ const t=i/(n-1||1); addElem('chair',p1.x+(p2.x-p1.x)*t-currentChairSize/2,p1.y+(p2.y-p1.y)*t-currentChairSize/2); } saveHistory(); } linePts=[]; clearSVG(); } }
function handleDim(pt){ const last=dimPts[dimPts.length-1], finalPt=last?snap(last,pt):pt; dimPts.push(finalPt); if(dimPts.length===2){ const val=prompt("寸法値","1.0m"); if(val){ const [p1,p2]=dimPts; const dx=p2.x-p1.x, dy=p2.y-p1.y; addElem('dim',p1.x,p1.y,{w:Math.sqrt(dx*dx+dy*dy),angle:Math.atan2(dy,dx)*180/Math.PI,text:val}); saveHistory(); } dimPts=[]; clearSVG(); } }
function drawPreviews(pt){ clearSVG(); if(arcPts.length===1) drawLine(arcPts[0],pt); if(arcPts.length===2) { const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',`M${arcPts[0].x},${arcPts[0].y} Q${pt.x},${pt.y} ${arcPts[1].x},${arcPts[1].y}`); p.setAttribute('stroke','#1d9e75'); p.setAttribute('fill','none'); svg.appendChild(p); } if(linePts.length===1) drawLine(linePts[0], snap(linePts[0],pt)); if(dimPts.length===1) drawLine(dimPts[0], snap(dimPts[0],pt)); }
function drawLine(p1,p2){ const l=document.createElementNS('http://www.w3.org/2000/svg','line'); l.setAttribute('x1',p1.x);l.setAttribute('y1',p1.y);l.setAttribute('x2',p2.x);l.setAttribute('y2',p2.y);l.setAttribute('stroke','#1d9e75');svg.appendChild(l); }
function clearSVG(){ svg.innerHTML=''; }

function saveHistory(){ const s=JSON.stringify({elements:elements.map(e=>({type:e.type,x:e.x,y:e.y,w:e.w,h:e.h,angle:e.angle,color:e.color,label:e.label,text:e.text}))}); history=history.slice(0,historyIndex+1); history.push(s); if(history.length>30)history.shift(); else historyIndex++; document.getElementById('undo-btn').disabled=historyIndex<=0; }
function undo(){ if(historyIndex>0){ historyIndex--; applyState(); } }
function applyState(){ const s=JSON.parse(history[historyIndex]); elements.forEach(e=>e.dom.remove()); elements=[]; s.elements.forEach(en=>addElem(en.type,en.x,en.y,en)); clearSelection(); }

function exportTemplate(){ const d=JSON.stringify({elements:elements.map(e=>({type:e.type,x:e.x,y:e.y,w:e.w,h:e.h,angle:e.angle,color:e.color,label:e.label,text:e.text}))}); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([d],{type:'application/json'})); a.download='template.json'; a.click(); }
function importTemplate(){ const i=document.createElement('input'); i.type='file'; i.onchange=async e=>{ const d=JSON.parse(await e.target.files[0].text()); elements.forEach(el=>el.dom.remove()); elements=[]; d.elements.forEach(en=>addElem(en.type,en.x,en.y,en)); saveHistory(); }; i.click(); }
async function loadPDF(){ const i=document.createElement('input'); i.type='file'; i.accept='.pdf'; i.onchange=async e=>{ const d=new Uint8Array(await e.target.files[0].arrayBuffer()); pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; const pdf=await pdfjsLib.getDocument({data:d}).promise; const page=await pdf.getPage(1); const vp=page.getViewport({scale:1.5}); const cv=document.getElementById('bg'); cv.width=vp.width; cv.height=vp.height; stage.style.width=vp.width+'px'; stage.style.height=vp.height+'px'; await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; cv.style.display='block'; }; i.click(); }
function exportPNG(){ html2canvas(stage,{scale:2}).then(c=>{ const a=document.createElement('a'); a.download='stage.png'; a.href=c.toDataURL(); a.click(); }); }

window.onload=init;
</script>
