<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stage Layout Maker v20.3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
    :root { --primary: #1d9e75; --accent: #e11d48; --bg: #d8d6cf; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; background: var(--bg); overflow: hidden; touch-action: none; }

    /* UI Components */
    #toolbar { background: white; border-bottom: 1px solid #ccc; padding: 5px 10px; display: flex; gap: 8px; align-items: center; z-index: 100; flex-shrink: 0; }
    .tb-group { display: flex; align-items: center; gap: 4px; font-size: 11px; }
    button { cursor: pointer; padding: 6px 10px; border: 1px solid #ccc; border-radius: 5px; background: white; font-size: 11px; }
    button.active { background: #e1f5ee; border-color: var(--primary); color: #0f6e56; font-weight: bold; }

    #main { display: flex; flex: 1; overflow: hidden; }
    #sidebar { width: 160px; background: white; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
    .inst-list { flex: 1; overflow-y: auto; }
    .inst { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 8px; }

    #canvas-wrap { flex: 1; overflow: auto; position: relative; padding: 40px; background: #eee; }
    #zoom-container { transform-origin: top left; }
    #stage { position: relative; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.2); user-select: none; }
    svg { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: visible; }
    
    /* Elements */
    .elem { position: absolute; cursor: move; display: flex; align-items: center; justify-content: center; z-index: 10; font-weight: bold; touch-action: none; pointer-events: auto; }
    .elem.selected { outline: 2px solid var(--primary); outline-offset: 4px; z-index: 100 !important; }
    .chair { border-radius: 50%; background: white; border: 2px solid; }

    /* Group Handle (SVG Path Interactivity) */
    .group-path { pointer-events: auto; cursor: move; }
    .group-path:hover { stroke: var(--primary); stroke-width: 3px; }

    #guide-panel { position: fixed; top: 60px; left: 180px; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 10px; z-index: 1000; font-size: 12px; display: none; }
    .step { opacity: 0.3; margin: 2px 0; }
    .step.active { opacity: 1; color: var(--primary); font-weight: bold; }
</style>
</head>
<body>

<div id="toolbar">
    <div class="tb-group">
        <button id="btn-select" class="active" onclick="setTool('select')">▷ 選択</button>
        <button id="btn-arc" onclick="setTool('arc')">⌒ 弧配置</button>
    </div>
    <div class="tb-group">
        ズーム:<input type="range" id="zoom-range" min="0.5" max="1.5" step="0.1" value="1.0" oninput="syncZoom(this.value)">
    </div>
    <button onclick="undo()">↩</button>
    <button onclick="deleteSelected()" style="color:var(--accent)">削除</button>
</div>

<div id="main">
    <div id="sidebar">
        <div id="list-main" class="inst-list"></div>
    </div>
    <div id="canvas-wrap">
        <div id="zoom-container">
            <div id="stage" style="width:1000px; height:750px;">
                <svg id="svg-layer"></svg>
            </div>
        </div>
    </div>
</div>

<div id="guide-panel">
    <div style="font-weight:bold">⌒ 弧配置手順</div>
    <div id="guide-steps"></div>
</div>

<script>
const INSTS = [{l:"Fl",c:"#e35"},{l:"Cl",c:"#36a"},{l:"Sax",c:"#1a8"},{l:"Tp",c:"#c70"}];
let elements = [], selectedIds = [], tool = 'select';
let zoom = 1.0, pts = [], history = [], historyIdx = -1;
let currentInst = INSTS[0], lastMouse = {x:0, y:0};
let dragData = null; // {type: 'elem'|'group', target: obj, ox, oy}

const stage = document.getElementById('stage');
const svg = document.getElementById('svg-layer');

function init() {
    const list = document.getElementById('list-main');
    INSTS.forEach(inst => {
        const div = document.createElement('div');
        div.className = 'inst';
        div.innerHTML = `<span style="width:10px;height:10px;background:${inst.c};border-radius:50%"></span>${inst.l}`;
        div.onclick = () => { currentInst = inst; setTool('arc'); };
        list.appendChild(div);
    });
    setupEvents();
    saveHistory();
}

function setTool(t) { tool = t; pts = []; updateGuide(); render(); }
function syncZoom(v) { zoom = v; document.getElementById('zoom-container').style.transform = `scale(${zoom})`; }

function getPointOnArc(p, t) {
    return {
        x: Math.pow(1-t, 2)*p[0].x + 2*(1-t)*t*p[2].x + Math.pow(t, 2)*p[1].x,
        y: Math.pow(1-t, 2)*p[0].y + 2*(1-t)*t*p[2].y + Math.pow(t, 2)*p[1].y
    };
}

function createGroup(p, n) {
    const gid = Date.now();
    for(let i=0; i<n; i++) {
        const t = n > 1 ? i/(n-1) : 0.5;
        const pos = getPointOnArc(p, t);
        elements.push({ id: Math.random(), type:'chair', x: pos.x-13, y: pos.y-13, w:26, h:26, color: currentInst.c, label: currentInst.l, gid, pts: JSON.parse(JSON.stringify(p)), t });
    }
    render(); saveHistory();
}

function render() {
    stage.querySelectorAll('.elem').forEach(n => n.remove());
    elements.forEach(el => {
        const div = document.createElement('div');
        div.className = `elem chair ${selectedIds.includes(el.id) ? 'selected' : ''}`;
        div.style.cssText = `left:${el.x}px; top:${el.y}px; width:${el.w}px; height:${el.h}px; border-color:${el.color}; color:${el.color}; font-size:9px;`;
        div.innerHTML = el.label;
        div.dataset.id = el.id;
        stage.appendChild(div);
    });
    renderSVG();
}

function renderSVG() {
    svg.innerHTML = '';
    const groups = {};
    elements.forEach(el => { if(el.gid) { if(!groups[el.gid]) groups[el.gid] = el.pts; } });

    Object.keys(groups).forEach(gid => {
        const p = groups[gid];
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${p[0].x} ${p[0].y} Q ${p[2].x} ${p[2].y} ${p[1].x} ${p[1].y}`);
        path.setAttribute('stroke', 'rgba(29,158,117,0.3)');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-dasharray', '4,4');
        path.setAttribute('stroke-width', '10'); // 掴みやすくするために太めの透明領域
        path.classList.add('group-path');
        
        // グループ移動用イベント
        path.addEventListener('pointerdown', e => {
            if(tool !== 'select') return;
            e.stopPropagation();
            const r = stage.getBoundingClientRect();
            const x = (e.clientX - r.left)/zoom, y = (e.clientY - r.top)/zoom;
            dragData = { type: 'group', gid: parseFloat(gid), ox: x, oy: y, originalPts: JSON.parse(JSON.stringify(p)) };
        });
        svg.appendChild(path);
    });

    // 弧作成中のガイド
    if(tool === 'arc' && pts.length > 0) {
        const guide = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        let d = `M ${pts[0].x} ${pts[0].y}`;
        if(pts.length === 1) d += ` L ${lastMouse.x} ${lastMouse.y}`;
        else if(pts.length === 2) d += ` Q ${lastMouse.x} ${lastMouse.y} ${pts[1].x} ${pts[1].y}`;
        guide.setAttribute('d', d);
        guide.setAttribute('stroke', 'var(--primary)');
        guide.setAttribute('fill', 'none');
        svg.appendChild(guide);
    }
}

function updateGuide() {
    const g = document.getElementById('guide-panel');
    if(tool !== 'arc') { g.style.display = 'none'; return; }
    g.style.display = 'block';
    const steps = ['左端', '右端', '膨らみ'];
    document.getElementById('guide-steps').innerHTML = steps.map((s,i) => `<div class="step ${i===pts.length?'active':''}">${i+1}. ${s}</div>`).join('');
}

function setupEvents() {
    stage.addEventListener('pointerdown', e => {
        const r = stage.getBoundingClientRect();
        const x = (e.clientX - r.left)/zoom, y = (e.clientY - r.top)/zoom;
        const target = e.target.closest('.elem');

        if(tool === 'select') {
            if(target) {
                const id = parseFloat(target.dataset.id);
                selectedIds = [id];
                const el = elements.find(item => item.id === id);
                dragData = { type: 'elem', el, ox: x - el.x, oy: y - el.y };
            } else { selectedIds = []; }
            render();
        } else if(tool === 'arc') {
            pts.push({x, y});
            if(pts.length === 3) {
                const n = prompt("椅子の数", "5");
                if(n) createGroup([...pts], parseInt(n));
                pts = [];
            }
            updateGuide(); render();
        }
    });

    window.addEventListener('pointermove', e => {
        const r = stage.getBoundingClientRect();
        lastMouse = { x: (e.clientX - r.left)/zoom, y: (e.clientY - r.top)/zoom };

        if(dragData) {
            if(dragData.type === 'elem') {
                dragData.el.x = lastMouse.x - dragData.ox;
                dragData.el.y = lastMouse.y - dragData.oy;
                if(dragData.el.gid) delete dragData.el.gid; // 個別に動かしたらグループ解除
            } else if(dragData.type === 'group') {
                const dx = lastMouse.x - dragData.ox;
                const dy = lastMouse.y - dragData.oy;
                // 1. 軌道(pts)を更新
                const newPts = dragData.originalPts.map(p => ({ x: p.x + dx, y: p.y + dy }));
                // 2. 所属するすべての椅子の座標を再計算
                elements.forEach(el => {
                    if(el.gid === dragData.gid) {
                        el.pts = newPts;
                        const newPos = getPointOnArc(newPts, el.t);
                        el.x = newPos.x - 13; el.y = newPos.y - 13;
                    }
                });
            }
            render();
        } else if(tool === 'arc') { renderSVG(); }
    });

    window.addEventListener('pointerup', () => { if(dragData) saveHistory(); dragData = null; });
}

function deleteSelected() {
    elements = elements.filter(el => !selectedIds.includes(el.id));
    selectedIds = []; render(); saveHistory();
}
function saveHistory() {
    history = history.slice(0, historyIdx + 1);
    history.push(JSON.stringify(elements));
    historyIdx++;
}
function undo() { if(historyIdx > 0) { historyIdx--; elements = JSON.parse(history[historyIdx]); render(); } }

window.onload = init;
</script>
</body>
</html>
